  HOW TO USE THIS FILE
  1. Save it anywhere on your computer or phone.
  2. Open it in any modern browser (double-click, or "Open with…").

<style>
  :root {

/* ════════════════════════════════════════════════════════════════
   2 · UTILITIES (IST time, ids, schedule)
   ════════════════════════════════════════════════════════════════ */
function istDateString(d) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata" }).format(d || new Date());
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  return Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 86400000);
}
function istDateOfIso(iso) {
  try { return istDateString(new Date(iso)); } catch (e) { return String(iso).slice(0, 10); }
}
function istNowMinutes() {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const get = (t) => Number((parts.find((p) => p.type === t) || {}).value || 0);
  return get("hour") * 60 + get("minute");
}
function friendlyDate(dateStr) {
  try {
    return new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short" }).format(new Date(dateStr + "T12:00:00Z"));
  } catch (e) { return dateStr; }
}
function formatClock(totalMin) {
  const w = ((totalMin % 1440) + 1440) % 1440;
  const h24 = Math.floor(w / 60), m = w % 60;
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return h12 + ":" + String(m).padStart(2, "0") + " " + (h24 < 12 ? "AM" : "PM");
}
function formatDuration(min) {
  if (min < 60) return min + "m";
  const h = Math.floor(min / 60), m = min % 60;
  return m === 0 ? h + "h" : h + "h " + m + "m";
}
function computeSchedule(dayStartMin, blocks) {
  let cursor = dayStartMin;
  return blocks.map((block) => {
    const startMin = cursor, endMin = cursor + block.durationMin;
    cursor = endMin;
    return { block, startMin, endMin };
  });
}
let _idCounter = 0;
function makeId(prefix) {
  _idCounter += 1;
  return (prefix || "b") + "_" + Date.now().toString(36) + "_" + _idCounter + "_" + Math.random().toString(36).slice(2, 8);
}
function levelFromXp(xp) { return 1 + Math.floor(Math.max(0, xp) / XP_PER_LEVEL); }

  const day = S.days[tomorrow] || seedDay(tomorrow, S.settings.dayStartMin, S.templateOverrides);
  const applied = [];
  if (patch.blocks && patch.blocks.length) {
    day.blocks = patch.blocks.map((b) => ({ id: makeId(), type: b.type, title: b.title,
      durationMin: b.durationMin, completed: false, completedAt: null, goal: null }));
    applied.push(patch.blocks.length + " blocks");
  }
  if (patch.focus) { day.goal = patch.focus; applied.push("focus"); }
  if (patch.presleepAffirmation) {
    const exists = S.reminderLines.some((l) => l.text === patch.presleepAffirmation);
    if (!exists) {
      const newId = makeId("line");
      S.reminderLines.unshift({ id: newId, text: patch.presleepAffirmation, category: patch.weightGoal || "identity" });
      S.lineWeights[newId] = 3; // surfaces quickly, still capped
      applied.push("a fresh affirmation");
    }
  }
  if (patch.weightGoal) {
    S.claudeEmphasis = { category: patch.weightGoal, date: tomorrow };
    applied.push("emphasis on " + patch.weightGoal);
  }
  if (applied.length) pushNudge("claude_emphasis", "From tonight's Claude session: applied " + applied.join(", ") + " for tomorrow.");
  S.days[tomorrow] = day;
  return applied;
}
function reflectYesterday(date, ranLongTitles) {
  const day = S.days[date], key = todayKey();
  for (const title of ranLongTitles) {
    let current = S.templateOverrides[title];
    if (current == null && day) {
      const b = day.blocks.find((x) => x.title === title);
      current = b ? b.durationMin : null;
    }
    if (current == null) current = resolveBaselineDuration(title, S.templateOverrides);
    const grown = Math.min(MAX_DURATION, current + 15);
    if (grown === current) continue;
    S.templateOverrides[title] = grown;
    S.titleNudgeDates[title] = key; // auto-trim won't fight a fresh grow
    pushNudge("duration_grow", '"' + title + '" ran long — grew ' + current + "m → " + grown + "m to match how it actually goes.");
  }
  if (day) day.reflected = true;
}
function rateGoals(ratings) {
  const key = todayKey();
  for (const g of S.goalAreas) {
    const r = ratings[g.id];
    g.rating = Math.min(10, Math.max(1, r != null ? r : g.rating));
  }
  S.lastCheckinDate = key;
  const goalWeights = computeGoalWeights(S, key);
  const weakest = weakestGoal(goalWeights);
  if (S.lastWeakestGoal && weakest !== S.lastWeakestGoal)
    pushNudge("weight_shift", "Growth edge moved from " + GOAL_META[S.lastWeakestGoal].label + " to " + GOAL_META[weakest].label + " — reminders and rituals now lean that way.");
  S.goalWeights = goalWeights;
  S.lastWeakestGoal = weakest;
}
function markResonance(lineId) {
  const key = todayKey(), day = S.days[key];
  if (!day || day.resonanceLineId) return; // write-once per day
  const line = S.reminderLines.find((l) => l.id === lineId);
  if (!line) return;
  day.resonanceLineId = lineId;
  S.lineWeights[lineId] = Math.min(LINE_WEIGHT_CAP, (S.lineWeights[lineId] || 1) + 1);
  pushNudge("line_resonance", '"' + line.text + '" carried you today — it\'ll show up a bit more often.');
}
function recordShownLine(lineId) {
  const day = todayPlan();
  if (!day || day.shownLineIds.includes(lineId)) return;
  day.shownLineIds = day.shownLineIds.concat(lineId).slice(-4);
  saveState(S); // no re-render needed
}
function logSos(event) {
  if (event.outcome === "passed") S.xp = Math.max(0, S.xp + SOS_XP);
  S.sosEvents.push(event);
}

/* ════════════════════════════════════════════════════════════════
   7 · DOM HELPERS — all user text goes through textContent (XSS-safe)
   ════════════════════════════════════════════════════════════════ */
function el(tag, attrs) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "style") node.style.cssText = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (v === true) node.setAttribute(k, "");
      else node.setAttribute(k, String(v));
    }
  }
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    appendChild(node, c);
  }
  return node;
}
function appendChild(node, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { for (const x of c) appendChild(node, x); return; }
  node.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
}
function svgEl(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (const k of Object.keys(attrs)) node.setAttribute(k, String(attrs[k]));
  for (let i = 2; i < arguments.length; i++) appendChild(node, arguments[i]);
  return node;
}

let toastTimer = null;
function showToast(text, ms, undoFn) {
  const host = document.getElementById("toasts");
  host.textContent = "";
  const t = el("div", { class: "toast", role: "status" },
    el("span", { class: "muted", style: "font-style:italic" }, text),
    undoFn ? el("button", { class: "undo", onclick: () => { undoFn(); host.textContent = ""; } }, "Undo") : null
  );
  host.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { host.textContent = ""; }, ms || 3500);
}

/* overlay plumbing: one at a time, Escape closes, scroll locked */
let overlayCleanup = null;
function openOverlay(buildPanel, onclose) {
  closeOverlay();
  const host = document.getElementById("overlays");
  const close = () => { closeOverlay(); if (onclose) onclose(); };
  const wrap = el("div", { class: "ovl", role: "dialog", "aria-modal": "true" },
    el("div", { class: "ovl-bg", onclick: close }));
  const panel = el("div", { class: "ovl-panel" });
  buildPanel(panel, close);
  wrap.appendChild(panel);
  host.appendChild(wrap);
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  const first = panel.querySelector("button, input, textarea, select");
  if (first) first.focus();
  overlayCleanup = () => {
    document.removeEventListener("keydown", onKey, true);
    document.body.style.overflow = prevOverflow;
    host.textContent = "";
  };
}
function closeOverlay() {
  if (overlayCleanup) { overlayCleanup(); overlayCleanup = null; }
}
function overlayHeader(panel, title, close) {
  panel.appendChild(el("div", { class: "row", style: "justify-content:space-between;margin-bottom:.9rem" },
    el("h2", { class: "ovl-title" }, title),
    el("button", { class: "xbtn", "aria-label": "Close", onclick: close }, "×")));
}
function stepDots(total, current) {
  const s = el("div", { class: "steps" });
  for (let i = 0; i < total; i++) s.appendChild(el("span", { class: i <= current ? "on" : "" }));
  return s;
}
function copyText(text, okMsg) {
  const done = () => showToast(okMsg || "Copied.", 2500);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { showToast("Copy failed — select and copy manually.", 4000); }
  document.body.removeChild(ta);
}

function greeting() {
  const m = istNowMinutes();
  if (m < 5 * 60) return "Still up";
  if (m < 12 * 60) return "Good morning";
  if (m < 17 * 60) return "Good afternoon";
  if (m < 21 * 60) return "Good evening";
  return "Winding down";
}

function render() {
  const app = document.getElementById("app");
  app.textContent = "";
  const key = todayKey();
  const day = S.days[key];
  if (!day) { ensureAndTick(); return render(); }

  app.appendChild(renderIdentityBar(key, day));

  // greeting + help + settings
  app.appendChild(el("div", { class: "row", style: "justify-content:space-between;margin:1rem 0 .8rem" },

      el("h1", { style: "font-size:18px;font-weight:800" }, greeting() + ".")),

  stack.appendChild(renderHud(day));

function renderIdentityBar(key, day) {
  const line = weightedReminderLine(S, key, day.dayStartMin);
  if (line && UI.lastLineId !== line.id) {
    UI.lastLineId = line.id;
    recordShownLine(line.id);
  }
  return el("div", { id: "identity" },
    el("p", { class: "statement" }, S.settings.identityStatement),
    line ? el("p", { class: "line" }, line.text,
      el("span", { class: "cat" }, CATEGORY_LABEL[line.category] || "")) : null);
}

function renderNowCard(day, scheduled, alignToday) {
  const now = istNowMinutes();
  const doneCount = day.blocks.filter((b) => b.completed).length;
  const allDone = day.blocks.length > 0 && doneCount === day.blocks.length;

  if (!day.morningPrimeDone && now < 15 * 60) {
    return el("div", { class: "now-card now-morning" },
      el("p", { class: "micro", style: "text-transform:uppercase;letter-spacing:.12em;color:#d97706" }, "Start here"),
      el("p", { style: "font-weight:700;margin:.2rem 0 .6rem" }, "Two minutes to set the day's frequency."),
      el("button", { class: "btn", style: "background:#d97706;color:#fff", onclick: openMorning }, "Morning prime →"));
  }
  if ((now >= 21 * 60 || allDone) && !day.preSleepDone) {
    return el("div", { class: "now-card now-evening" },
      el("p", { class: "micro", style: "text-transform:uppercase;letter-spacing:.12em;color:var(--slate)" }, "Close the day"),
      el("p", { style: "font-weight:700;margin:.2rem 0 .3rem" }, doneCount + "/" + day.blocks.length + " blocks · alignment " + alignToday + "/100"),
      el("p", { class: "tiny muted", style: "margin-bottom:.6rem" }, "Review as feedback, impress the wish fulfilled, and hand tomorrow to the coach."),
      el("button", { class: "btn", style: "background:#475569;color:#fff", onclick: openPresleep }, "Pre-sleep impression →"));
  }
  // current / next block
  const current = scheduled.find((x) => !x.block.completed && now >= x.startMin && now < x.endMin);
  const nextUp = current || scheduled.find((x) => !x.block.completed);
  if (!nextUp) {
    return el("div", { class: "now-card now-block" },
      el("p", { style: "font-weight:700" }, allDone ? "Every block done. That's evidence." : "No blocks yet — add your day below."));
  }
  const meta = TYPE_META[nextUp.block.type];
  const remaining = current ? nextUp.endMin - now : null;
  return el("div", { class: "now-card now-block" },
    el("p", { class: "micro", style: "text-transform:uppercase;letter-spacing:.12em;color:var(--violet-soft)" },
      current ? "Now" : "Up next"),
    el("div", { class: "row", style: "justify-content:space-between;margin-top:.25rem;gap:1rem" },
      el("div", null,
        el("p", { style: "font-weight:700;font-size:16px" }, nextUp.block.title),
        el("p", { class: "tiny dim" },
          formatClock(nextUp.startMin) + " – " + formatClock(nextUp.endMin) + " · " + meta.label +
          (remaining !== null ? " · " + formatDuration(remaining) + " left" : ""))),
      el("button", { class: "btn btn-primary", style: "flex:none", onclick: () => toggleComplete(nextUp.block.id) }, "Done ✓")));
}

function renderRitualRow(day) {

  card.appendChild(el("p", { class: "label" }, firstTime ? "Set your target" : "Weekly check-in"));
  card.appendChild(el("p", { class: "tiny muted", style: "margin-bottom:.7rem" },
    firstTime
      ? "Rate where each goal area feels right now, 1–10. This is the target picture the whole system steers by — honest beats optimistic."
      : "A week has passed. Where does each area honestly stand? The gap you report is what the servo corrects toward."));
  for (const g of S.goalAreas) {

function renderTrend(key, alignToday) {
  const card = el("div", { class: "card" });
  card.appendChild(el("p", { class: "label" }, "Alignment — 14 days"));

  const dates = Object.keys(S.alignment).sort().slice(-13);
  const values = dates.map((d) => S.alignment[d]).concat(alignToday);
  const W = 280, H = 56, PAD = 4;
  const n = values.length;
  const x = (i) => (n === 1 ? W / 2 : PAD + (i * (W - 2 * PAD)) / (n - 1));
  const y = (v) => H - PAD - (v / 100) * (H - 2 * PAD);
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: "56", preserveAspectRatio: "none" });
  svg.appendChild(svgEl("line", { x1: 0, x2: W, y1: y(80), y2: y(80), stroke: "#3f3f46", "stroke-dasharray": "3 4", "stroke-width": 1 }));
  if (n > 1) {
    const solid = values.slice(0, -1).map((v, i) => x(i) + "," + y(v)).join(" ");
    if (values.length > 2)
      svg.appendChild(svgEl("polyline", { points: solid, fill: "none", stroke: "var(--violet)", "stroke-width": 2, "stroke-linejoin": "round" }));
    svg.appendChild(svgEl("line", { x1: x(n - 2), y1: y(values[n - 2]), x2: x(n - 1), y2: y(values[n - 1]),
      stroke: "var(--fuchsia)", "stroke-width": 2, "stroke-dasharray": "3 3" }));
  }
  values.forEach((v, i) => {
    const last = i === n - 1;
    svg.appendChild(svgEl("circle", { cx: x(i), cy: y(v), r: last ? 3.5 : 2.5,
      fill: last ? "var(--bg)" : "var(--violet)", stroke: last ? "var(--fuchsia)" : "none", "stroke-width": last ? 2 : 0 }));
  });
  card.appendChild(svg);
  card.appendChild(el("p", { class: "micro dim", style: "margin:.15rem 0 .9rem" },
    "today " + alignToday + "/100 · the dotted rail at 80 is “aligned” · today stays dashed until it's finalized overnight"));

  for (const g of S.goalAreas) {
    const behavior = 1 - missRateFor(S, g.id, key);
    card.appendChild(el("div", { style: "margin-bottom:.5rem" },
      el("div", { class: "row", style: "justify-content:space-between" },
        el("span", { class: "micro", style: "font-weight:600" }, g.label),
        el("span", { class: "micro dim" }, g.rating + "/10")),
      el("div", { class: "goalbar" },
        el("div", { class: "fill", style: "width:" + g.rating * 10 + "%;background:" + GOAL_META[g.id].color }),
        el("div", { class: "mark", style: "left:" + Math.round(behavior * 100) + "%", title: "behavior this week" }))));
  }
  const weakest = weakestGoal(S.goalWeights);
  card.appendChild(el("p", { class: "chip", style: "margin-top:.4rem;border-color:rgba(139,92,246,.4)" },
    el("span", { class: "dot", style: "background:" + GOAL_META[weakest].color }),
    "Growth edge: " + GOAL_META[weakest].label + " (" + Math.round((S.goalWeights[weakest] || 0) * 100) + "% of the lean)"));
  return card;
}

function moveBlock(day, index, dir) {
  const t = index + dir;
  if (t < 0 || t >= day.blocks.length) return;
  const tmp = day.blocks[index];
  day.blocks[index] = day.blocks[t];
  day.blocks[t] = tmp;
  commit();
}
function deleteBlock(day, b, index) {
  day.blocks = day.blocks.filter((x) => x.id !== b.id);
  syncCleanCredit(todayKey());
  commit();
  showToast('Deleted "' + b.title + '"', 6000, () => {
    const d = todayPlan();
    if (!d) return;
    const idx = Math.min(Math.max(0, index), d.blocks.length);
    d.blocks.splice(idx, 0, b);
    syncCleanCredit(todayKey());
    commit();
  });
}

function minutesOfIso(iso) {
  try {
    const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date(iso));
    const get = (t) => Number((parts.find((p) => p.type === t) || {}).value || 0);
    return get("hour") * 60 + get("minute");
  } catch (e) { return 0; }
}

      el("div", { style: "flex:1" }, el("p", { class: "label" }, "Go-to person"),
        el("input", { value: cname, placeholder: "Name", oninput: (e) => { cname = e.target.value; } })),
      el("div", { style: "flex:1" }, el("p", { class: "label" }, "Their number"),
        el("input", { value: cphone, placeholder: "+91…", inputmode: "tel", oninput: (e) => { cphone = e.target.value; } }))));
    panel.appendChild(field("Car — ownership line", carLine, (e) => { carLine = e.target.value; }));
    panel.appendChild(field("Car — the numbers", carNumbers, (e) => { carNumbers = e.target.value; }));
    const cadenceLabel = el("p", { class: "label" }, "Reminder rhythm — every " + Math.round((cadence / 60) * 10) / 10 + "h");
    panel.appendChild(el("div", { style: "margin-bottom:.8rem" }, cadenceLabel,
      el("input", { type: "range", min: 30, max: 240, step: 30, value: cadence, oninput: (e) => {
        cadence = Number(e.target.value);
        cadenceLabel.textContent = "Reminder rhythm — every " + Math.round((cadence / 60) * 10) / 10 + "h";
      } })));
    panel.appendChild(el("button", { class: "btn btn-primary", style: "width:100%", onclick: () => {
      S.settings.identityStatement = identity.trim() || s.identityStatement;
      S.settings.contactName = cname.trim();
      S.settings.contactPhone = cphone.trim();
      S.settings.car.line = carLine.trim();
      S.settings.car.numbers = carNumbers.trim();
      S.settings.reminderCadenceMin = Math.min(360, Math.max(30, cadence));
      closeOverlay(); commit();
    } }, "Save"));

    // notifications
    panel.appendChild(el("div", { style: "margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--border)" },
      el("p", { class: "label" }, "Reminders while this tab is open"),
      el("p", { class: "tiny muted", style: "margin-bottom:.5rem" },
        "At your reminder rhythm, the current identity line appears as a system notification (or an in-page banner if notifications aren't allowed). Only works while the planner is open — this file has no server."),
      el("button", { class: "btn btn-ghost", style: "width:100%", onclick: (e) => {
        if (localStorage.getItem(NOTIFY_KEY) === "1") {
          localStorage.removeItem(NOTIFY_KEY);
          e.target.textContent = "Enable reminders";
          showToast("Reminders off.", 2500);
          return;
        }
        localStorage.setItem(NOTIFY_KEY, "1");
        e.target.textContent = "Disable reminders";
        if (typeof Notification !== "undefined" && Notification.permission === "default") {
          Notification.requestPermission().then((p) => {
            showToast(p === "granted" ? "Reminders on — you'll get system notifications." : "Reminders on — in-page banners (notifications blocked).", 4000);
          });
        } else {
          showToast("Reminders on.", 2500);
        }
      } }, localStorage.getItem(NOTIFY_KEY) === "1" ? "Disable reminders" : "Enable reminders")));

    // data
    const fileInput = el("input", { type: "file", accept: "application/json,.json", style: "display:none",
      onchange: (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const imported = importStateJson(String(reader.result || ""));
          if (!imported) { showToast("That file isn't a planner backup.", 4000); return; }
          S = imported;
          ensureAndTick();
          closeOverlay(); commit();
          showToast("Imported — your data is loaded.", 3500);
        };
        reader.readAsText(file);
        e.target.value = "";
      } });
    panel.appendChild(el("div", { style: "margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--border)" },
      el("p", { class: "label" }, "Your data"),
      el("div", { class: "row" },
        el("button", { class: "btn btn-ghost", style: "flex:1", onclick: () => {
          const blob = new Blob([exportStateJson(S)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = el("a", { href: url, download: "becoming-backup-" + todayKey() + ".json" });
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
        } }, "⬇ Export backup"),
        el("button", { class: "btn btn-ghost", style: "flex:1", onclick: () => fileInput.click() }, "⬆ Import"),
        fileInput),
      el("p", { class: "micro dim", style: "margin-top:.5rem" },
        "Everything lives in this browser, on this device. Export before clearing browser data — the same file also imports into the planner on your website, and vice-versa.")));
  });
}

    const sec = el("div", { class: "helpsec" });
    function h(t) { sec.appendChild(el("h3", null, t)); }
    function p(t) { sec.appendChild(el("p", null, t)); }
    function ul(items) { const u = el("ul"); for (const it of items) u.appendChild(el("li", null, it)); sec.appendChild(u); }

    h("What this is");
    p("A daily planner that doubles as an identity anchor. You set a target picture of who you're becoming (the four goal areas), live your day in blocks, and the system measures the gap and makes small automatic corrections — like a thermostat for your self-image. Every correction is visible in the Training log. Nothing changes silently.");

    h("The daily rhythm — three touches");
    ul([
      "Morning (2–3 min): tap Morning prime. Read who you are, rehearse the day going well, feel it as already true, set today's ONE thing.",
      "During the day: live the blocks. Tap the checkbox when one is done. Use ±15 if a block needs more or less time, ↑↓ to reorder, and Capture to park stray thoughts without leaving the block.",
      "Night (2–3 min): tap Pre-sleep. Review the day as feedback, write one honest line, pick the line that carried you, and fall asleep on tonight's affirmation.",
    ]);

    h("The Claude bridge (optional but powerful)");
    ul([
      "In the Pre-sleep flow, tap “Copy Today card”.",
      "Open your own Claude app (claude.ai — phone or desktop) and paste it. Talk the day through like a coaching session.",
      "When you're done, ask Claude for tomorrow's plan. It replies with a small ```planner code block.",
      "Copy Claude's reply, paste it into the box in the Pre-sleep flow, tap Apply. Tomorrow's plan, focus, and emphasis update automatically.",
      "No account is connected and nothing is sent anywhere — you are the bridge. The planner adapts on its own even if you skip this.",
    ]);

    h("How it learns you (the servo)");
    ul([
      "Alignment (0–100): 80% finishing blocks + 10% each ritual + a small bonus for every redirect you run. Finalized overnight; the sparkline shows 14 days.",
      "Weekly check-in: rate the four areas 1–10. The weakest area becomes your growth edge — reminders, the morning rehearsal, and tonight's line lean toward it.",
      "Chronically missed block: quietly trimmed by 15 minutes (never below 15) so the plan matches reality — logged in the Training log.",
      "Blocks that ran long: tell it in the morning reflection card and they grow 15 minutes.",
      "Which line carried you: your nightly one-tap makes that line show up more often.",
    ]);

    h("Streak, shield, and never quitting");
    ul([
      "A clean day = every block done. Clean days build your streak and lifetime count.",
      "One grace shield absorbs a missed day — the streak holds. It refills after 7 clean days.",
      "A reset only ever touches the streak number. Your level, XP, and lifetime clean days are permanent evidence.",
      "Miss a day entirely? The system counts it honestly and moves on. Feedback, not verdict.",
    ]);

    h("The redirect (SOS)");
    p("When the pull toward the screen shows up: tap “I feel the pull”. Body reset → reach a real person → become the man. Using the tool earns XP — reaching for it IS the win, and tomorrow's morning rehearsal will aim at that exact moment.");

    h("Your data");
    ul([
      "Everything stays in this browser on this device. No internet, no account, no tracking.",
      "Settings → Export backup gives you a JSON file. Import it here, on another device, or into the planner on your website — they speak the same format.",
      "If you clear browser data without exporting, the planner's memory is gone. Export weekly.",
    ]);

    h("Reminders");
    p("Settings → Enable reminders. While the tab is open, the current identity line surfaces at your chosen rhythm as a system notification (or an in-page banner if notifications are blocked). For all-day nudges when the file is closed, set recurring phone alarms at the same cadence — the sticky bar always has your current line when you check in.");

    panel.appendChild(sec);
    panel.appendChild(el("button", { class: "btn btn-primary", style: "width:100%;margin-top:1rem", onclick: close }, "Got it"));
  });
}

function openOnboarding() {
  const screens = [
    { title: "This file is your planner.", body: "No install, no account, no internet. Everything you do is saved privately in this browser, on this device. Bookmark this tab — or Add to Home Screen on your phone — so it's one tap away." },
    { title: "The loop: prime → live → impress.", body: "Morning prime sets the frequency (2 min). The blocks are your day — one tap to complete. Pre-sleep closes the loop and plants tomorrow's impression. Do the two rituals daily; they're 10% of your Alignment score each." },
    { title: "It trains toward who you're becoming.", body: "Rate your four goal areas weekly. The planner measures the gap between that target and how you actually live, then makes small corrections — trimming what chronically misses, growing what runs long, leaning reminders toward your growth edge. Every adjustment shows in the Training log. Nothing changes silently." },
    { title: "At night, bring in the coach.", body: "The Pre-sleep flow builds a Today card. Copy it, paste it to Claude in your own Claude app, and talk the day through. Ask for tomorrow's plan, paste Claude's reply back, tap Apply — tomorrow rebuilds itself. First step now: the check-in card at the top. Rate the four areas to set your target." },
  ];
  let idx = 0;
  openOverlay(function build(panel, close) {
    function paint() {
      panel.textContent = "";
      panel.appendChild(stepDots(screens.length, idx));
      panel.appendChild(el("p", { style: "font-size:19px;font-weight:800;margin:.4rem 0 .5rem" }, screens[idx].title));
      panel.appendChild(el("p", { class: "muted", style: "line-height:1.65" }, screens[idx].body));
      panel.appendChild(el("div", { class: "row", style: "margin-top:1.2rem" },
        idx > 0 ? el("button", { class: "btn btn-ghost", onclick: () => { idx--; paint(); } }, "Back") : null,
        el("button", { class: "btn btn-primary", style: "flex:1", onclick: () => {
          if (idx < screens.length - 1) { idx++; paint(); return; }
          try { localStorage.setItem(ONBOARD_KEY, "1"); } catch (e) {}
          close();
        } }, idx < screens.length - 1 ? "Next" : "Set my target →")));
    }
    paint();
  }, function onclose() {
    try { localStorage.setItem(ONBOARD_KEY, "1"); } catch (e) {}
  });
}

/* ════════════════════════════════════════════════════════════════
   10 · TICK — midnight rollover, line rotation, optional reminders
   ════════════════════════════════════════════════════════════════ */
function currentSlot() {
  const day = todayPlan();
  const start = day ? day.dayStartMin : S.settings.dayStartMin;
  const cadence = Math.max(30, S.settings.reminderCadenceMin);
  return Math.floor(Math.max(0, istNowMinutes() - start) / cadence);
}
function minuteTick() {
  const key = todayKey();
  const hadToday = !!S.days[key];
  const evaluated = S.lastEvalDate === addDays(key, -1);
  if (!hadToday || !evaluated) {
    ensureAndTick();
    saveState(S);
    render();
  } else {
    // refresh rotating line / now card without stomping on typing or overlays
    const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    const overlayOpen = !!document.querySelector(".ovl");
    if (!typing && !overlayOpen) {
      const day = S.days[key];
      const line = weightedReminderLine(S, key, day.dayStartMin);
      if (line && line.id !== UI.lastLineId) render();
    }
  }
  // optional reminder notification at each cadence slot
  if (localStorage.getItem(NOTIFY_KEY) === "1") {
    const slot = currentSlot();
    if (UI.lastNotifySlot === null) { UI.lastNotifySlot = slot; return; }
    if (slot > UI.lastNotifySlot) {
      UI.lastNotifySlot = slot;
      const day = todayPlan();
      const line = day ? weightedReminderLine(S, key, day.dayStartMin) : null;
      const text = line ? line.text : S.settings.identityStatement;
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        try { new Notification("Becoming", { body: text, tag: "becoming-reminder" }); }
        catch (e) { showToast(text, 8000); }
      } else {
        showToast(text, 8000);
      }
    }
  }
}

/* ════════════════════════════════════════════════════════════════
   11 · BOOT
   ════════════════════════════════════════════════════════════════ */
S = loadState();
ensureAndTick();
S.hydrated = true;
saveState(S);
UI.lastNotifySlot = currentSlot();
render();

let onboarded = false;
try { onboarded = localStorage.getItem(ONBOARD_KEY) === "1"; } catch (e) {}
if (!onboarded) openOnboarding();

setInterval(minuteTick, 60000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") minuteTick();
});
</script>
